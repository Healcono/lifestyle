<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سبک زندگی</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one calm column under a header carrying the center's emblem; palette taken from the logo (forest green + gold); single typeface (Vazirmatn) for all three languages */
:root{
  --bg:#F4F7F2; --surface:#FFFFFF; --ink:#13261A; --muted:#566B5C; --line:#DAE3D8;
  --brand:#1E6332; --gold:#C2921C; --gold-soft:#F8EFD6;
  --accent:#1E6332; --accent-soft:#E4F0E6; --on-accent:#FFFFFF;
  --good:#2B7A3D; --warn:#B26A00; --bad:#BE3A2E;
  --good-soft:#E1F1E5; --warn-soft:#FBF0D9; --bad-soft:#FBE4E1;
  --font:'Vazirmatn',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1911; --surface:#14251A; --ink:#E7F0E8; --muted:#97AE9D; --line:#243A2A;
  --brand:#5DBB78; --gold:#E2B54B; --gold-soft:#3A2F12;
  --accent:#5DBB78; --accent-soft:#173A22; --on-accent:#08210F;
  --good:#6CCB86; --warn:#E3A945; --bad:#EE7F72;
  --good-soft:#163523; --warn-soft:#3A2E12; --bad-soft:#3E1D19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1911; --surface:#14251A; --ink:#E7F0E8; --muted:#97AE9D; --line:#243A2A;
  --brand:#5DBB78; --gold:#E2B54B; --gold-soft:#3A2F12;
  --accent:#5DBB78; --accent-soft:#173A22; --on-accent:#08210F;
  --good:#6CCB86; --warn:#E3A945; --bad:#EE7F72;
  --good-soft:#163523; --warn-soft:#3A2E12; --bad-soft:#3E1D19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.75;font-synthesis:none;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea,summary,a{font-family:var(--font)}
.wrap{max-width:760px;margin-inline:auto}
.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px;border-bottom:2px solid var(--gold)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.emb{width:54px;height:43px;flex:none}
.bn{font-weight:800;font-size:19px;line-height:1.3;color:var(--brand)}
.bs{font-size:12.5px;color:var(--muted);line-height:1.4}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted);min-width:40px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible,.btn:focus-visible,.opt:focus-within,input:focus-visible,select:focus-visible,.cp:focus-visible,.mode:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding-top:18px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.4;margin:6px 0 6px;font-weight:800;text-wrap:balance;color:var(--brand)}
h2{font-size:19px;line-height:1.5;margin:0 0 8px;font-weight:800;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.mode{all:unset;cursor:pointer;display:block;border:1.5px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);min-width:0}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode b{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--brand)}
.mode span{color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lbl{font-weight:700;font-size:14px}
input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:11px;font-weight:700;background:var(--accent);color:var(--on-accent);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
[dir=ltr] .btn.back .ico,[dir=rtl] .btn.fwd .ico{transform:scaleX(-1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer;background:var(--bg);min-width:0}
.opt input{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:0}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt span{min-width:0;overflow-wrap:anywhere}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--accent)}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--line)}
.notice .ico{color:var(--gold);margin-top:3px}
/* results */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring text{font-family:var(--font);fill:var(--ink)}
.verdict{display:inline-block;padding:4px 14px;border-radius:99px;font-weight:800;font-size:14px}
.v-good{background:var(--good-soft);color:var(--good)}
.v-warn{background:var(--warn-soft);color:var(--warn)}
.v-bad{background:var(--bad-soft);color:var(--bad)}
.dims{display:flex;flex-direction:column;gap:12px}
.dim{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center}
.dn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.dn .ico{color:var(--brand)}
.dim .bar{grid-column:1/-1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.dim .bar i{display:block;height:100%;border-radius:99px}
.dim .n{font-variant-numeric:tabular-nums;font-weight:800;text-align:end}
.radar text{font-family:var(--font);fill:var(--muted);font-size:11px}
.rec{border-inline-start:4px solid var(--line);padding:4px 14px;margin-block:10px}
.rec h3 .ico{color:var(--brand)}
.rec.bad{border-color:var(--bad)} .rec.warn{border-color:var(--warn)} .rec.good{border-color:var(--good)}
.rec ul{margin:6px 0 0;padding-inline-start:20px}
.rec li{margin-bottom:4px}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface)}
summary{cursor:pointer;font-weight:700}
.scroll{overflow-x:auto}
/* contact */
footer{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;border-top:3px solid var(--gold)}
@media (max-width:520px){.contact{grid-template-columns:1fr}}
.clogo{width:96px;height:76px}
.cname{font-weight:800;color:var(--brand);font-size:16px}
.crow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:baseline}
.crow .ico{color:var(--gold);align-self:center}
.ck{color:var(--muted);font-size:13px}
.cv{min-width:0;overflow-wrap:anywhere}
.cp{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:1px 10px}
.fine{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// ---------- UI strings (fa / en / ar) ----------
const LANGS={fa:{n:'فارسی',dir:'rtl',loc:'fa-IR'},en:{n:'EN',dir:'ltr',loc:'en-US'},ar:{n:'العربية',dir:'rtl',loc:'ar-EG'}};
const UI={
brand:{fa:'سبک زندگی',en:'Lifestyle',ar:'نمط الحياة'},
alcPriv:{fa:'این پرسش فقط برای ارزیابی سلامت است، نه قضاوت. پاسخ شما فقط در همین مرورگر پردازش می‌شود و جایی ثبت یا ارسال نمی‌شود. می‌توانید آن را رد کنید.',en:'This question is only for health assessment, not judgement. Your answer is processed only in this browser and is never recorded or sent anywhere. You may skip it.',ar:'هذا السؤال لتقييم الصحة فقط وليس للحكم. تُعالَج إجابتك في هذا المتصفح فقط ولا تُسجَّل ولا تُرسَل إلى أي مكان. يمكنك تخطيه.'},
alcSkip:{fa:'ترجیح می‌دهم پاسخ ندهم',en:'I prefer not to answer',ar:'أفضّل عدم الإجابة'},
alcSkipNote:{fa:'بُعد الکل پاسخ داده نشد و در امتیاز کلی لحاظ نشده است؛ امتیاز بر پایه بقیه ابعاد محاسبه شد.',en:'You skipped the alcohol dimension, so it is left out and the score is based on the other dimensions.',ar:'تخطيت بُعد الكحول، لذا لم يُحتسب وبُنيت الدرجة على بقية الأبعاد.'},
alcGen:{fa:'توصیه عمومی WHO: هیچ مقدار الکلی بدون اثر بر سلامت نیست و هرچه کمتر، ایمن‌تر. اگر نگرانی یا پرسشی دارید، گفتگو با پزشک محرمانه است.',en:'General WHO advice: no amount of alcohol is free of health effects, and the less the safer. If you have concerns or questions, a conversation with a doctor is confidential.',ar:'نصيحة عامة من المنظمة: لا توجد كمية من الكحول بلا أثر على الصحة، وكلما قلّ كان أسلم. إن كانت لديك مخاوف أو أسئلة فالحديث مع الطبيب سرّي.'},
tagline:{fa:'ارزیابی سبک زندگی سالم',en:'Healthy lifestyle assessment',ar:'تقييم نمط الحياة الصحي'},
center:{fa:'مرکز پژوهشی سلامت و سبک زندگی',en:'Health and Lifestyle Research Center',ar:'مركز أبحاث الصحة ونمط الحياة'},

methodP:{fa:'هر پاسخ به نمره‌ای از ۰ تا ۱۰۰ تبدیل می‌شود، نمره هر بُعد میانگین پاسخ‌های همان بُعد است و امتیاز کلی میانگین وزنی ابعاد است. آستانه‌ها از منابع بالا گرفته شده‌اند. در دخانیات و الکل، مصرف فعلی سقف امتیاز را پایین می‌آورد، چون این رفتارها اثر خطی و قابل‌جبران با سایر ابعاد ندارند.',en:'Each answer becomes a 0 to 100 score, each dimension is the mean of its answers, and the overall score is a weighted mean of the dimensions. Thresholds come from the sources listed. For tobacco and alcohol, current use caps the score, because these risks cannot be offset by good habits elsewhere.',ar:'تتحول كل إجابة إلى درجة من ٠ إلى ١٠٠، ودرجة كل بُعد هي متوسط إجاباته، والدرجة العامة هي المتوسط الموزون للأبعاد. العتبات مأخوذة من المصادر المذكورة. في التبغ والكحول يخفض الاستخدام الحالي سقف الدرجة لأن هذه المخاطر لا تعوّضها العادات الجيدة الأخرى.'},
limits:{fa:'محدودیت‌ها: داده‌ها خودگزارشی هستند؛ در نسخه سریع برخی ابزارها (مثل WHO-5 و AUDIT-C) کوتاه‌شده‌اند؛ اوزان ابعاد تصمیم طراحی‌اند و از یک مدل بالینی واحد نیامده‌اند؛ بعضی آستانه‌ها (مثل نشستن) در WHO عدد مشخصی ندارند.',en:'Limits: data are self-reported; the quick version shortens some tools (WHO-5, AUDIT-C); dimension weights are a design choice, not from a single clinical model; some thresholds (such as sitting time) have no numeric WHO cut-off.',ar:'القيود: البيانات مُبلَّغ عنها ذاتياً؛ تختصر النسخة السريعة بعض الأدوات (WHO-5 وAUDIT-C)؛ أوزان الأبعاد قرار تصميمي وليست من نموذج سريري واحد؛ بعض العتبات (مثل الجلوس) ليس لها رقم محدد لدى المنظمة.'},

  text(`${L(UI.emailL)}: ${CONTACT.email}`,{size:21,rtl:false});text(`${L(UI.telL)}: ${CONTACT.tel}`,{size:21,rtl:false});
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
  pages.forEach((c,i)=>{if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297);});
  return pdf.output('arraybuffer');
}
async function doPdf(){
  const msg=$('#pdfMsg'),btn=$('#pdfBtn');
  try{
    const dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);
    if(!dl){msg.textContent=L(UI.pdfNA);return;}
    btn.disabled=true;msg.textContent=L(UI.pdfBusy);
    const buf=await buildPdf();
    await dl.save({filename:`healthy-lifestyle-report-${new Date().toISOString().slice(0,10)}.pdf`,data:buf});
    msg.textContent='';
  }catch(e){msg.textContent=(e&&e.code==='declined')?'':L(UI.pdfFail);}
  finally{if(btn)btn.disabled=false;}
}
// ---------- events ----------
function go(step){S.step=step;render();try{window.scrollTo(0,0);}catch(e){}const h=$('#qh');if(h)h.focus({preventScroll:true});}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='lang'){S.lang=v;try{localStorage.setItem('hls_lang',v);}catch(_){}render();}
  else if(a==='theme'){theme=v;try{localStorage.setItem('hls_theme',v);}catch(_){}render();}
  else if(a==='mode'){S.mode=v;render();}
  else if(a==='sex'){S.sex=v;if(v!=='f')S.preg=false;render();}
  else if(a==='start'){S.qi=0;go('q');}
  else if(a==='prev'){if(S.qi===0)go('intro');else{S.qi--;go('q');}}
  else if(a==='next'){const n=activeQs(S.mode).length;if(S.qi===n-1)go('result');else{S.qi++;go('q');}}
  else if(a==='again'){S.ans={};S.skipAlc=false;S.qi=0;go('intro');}
  else if(a==='skipalc'){S.skipAlc=true;go('result');}
  else if(a==='pdf')doPdf();
  else if(a==='copy'){const txt=CONTACT[v];
    Promise.resolve().then(()=>navigator.clipboard.writeText(txt)).then(()=>{b.textContent=L(UI.copied);setTimeout(()=>{b.textContent=L(UI.copy);},1500);}).catch(()=>{});}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='q'){const q=activeQs(S.mode)[S.qi];S.ans[q.id]=Number(t.value);
    document.querySelectorAll('.opt').forEach(l=>l.classList.toggle('on',l.contains(t)));$('#nextBtn').disabled=false;}
  else if(t.id==='preg'||t.id==='chronic'){S[t.id]=t.checked;t.closest('.opt').classList.toggle('on',t.checked);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='age'){S.age=t.value;$('#startBtn').disabled=!(ageOk()&&S.sex);$('#ageHint').textContent=(S.age!==''&&!ageOk())?L(X.ageNote):'';}
  else if(t.id==='num'){const q=activeQs(S.mode)[S.qi];S.ans[q.id]=t.value;const ok=answered(q);
    $('#nextBtn').disabled=!ok;$('#numHint').textContent=(t.value!==''&&!ok)?fill(L(X.range),{a:fmt(q.num.min),b:fmt(q.num.max)}):'';}
});
render();

</script>
